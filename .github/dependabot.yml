# .github/dependabot.yml — 의존성 취약점/노후화 자동 감지.
#
# 존재 이유: 이 레포는 public이고, 개인정보(위치·장애 여부)를 다루는 서비스라 취약 의존성이
# 그대로 심사 리스크가 됩니다(QA/보안 소관 리스크 ⑨). Dependabot은 GitHub Actions 분을
# 소모하지 않으므로 무료 플랜에서도 부담이 없습니다.
#
# ⚠️ PR 노이즈 관리: 해커톤 일정(8/10 제출) 중 매일 PR이 쌓이면 팀이 무시하게 됩니다.
#    weekly + minor/patch 그룹화 + PR 상한으로 "주 1회 한두 개"가 되도록 조정했습니다.
version: 2
updates:
  # ── GitHub Actions 버전 (actions/checkout@v4 등)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  # ── 파이썬 앱 (앱마다 pyproject.toml이 따로 있으므로 디렉토리도 따로 등록해야 합니다)
  # 추정: Dependabot의 pip 생태계는 PEP 621 pyproject.toml을 인식합니다. 첫 주에 PR이
  # 하나도 열리지 않으면 Insights > Dependency graph > Dependabot 탭에서 파싱 오류를 확인하세요.
  - package-ecosystem: "pip"
    directory: "/apps/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/apps/ai-engine"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      ai-engine-minor-patch:
        update-types: ["minor", "patch"]

  # ── pre-commit 훅 rev (.pre-commit-config.yaml)
  # 존재 이유: ruff는 위 두 앱의 dev extra와 .pre-commit-config.yaml의 rev가 **한 쌍**인데,
  # rev는 pip 생태계 밖이라 위 블록들이 앱만 올리고 훅은 그대로 두고 갑니다. 실제로 #43에서
  # 앱이 0.16.0으로 올라간 뒤 훅만 v0.15.22에 남아, CI lint 잡과 pre-commit 잡이 서로 다른
  # ruff를 쓰는 상태가 #52까지 이어졌습니다(수동 정렬로 해소). 이 블록은 그 드리프트를
  # 탐지하는 게 아니라 애초에 생기지 않게 합니다.
  # ⚠️ 훅 rev가 올라가는 PR은 "린트 설정 변경"입니다 — 앱 pyproject의 `ruff==`도 같은 PR에서
  #    함께 맞춰야 합니다(apps/backend/pyproject.toml의 주석 규약과 동일).
  #    ruff 외의 훅은 이 블록이 여는 PR만으로 완결됩니다. gitleaks도 예외였으나(ci.yml이
  #    버전을 따로 적어두고 있었음) ci.yml이 rev를 읽어가도록 바꿔 짝을 없앴습니다.
  # 확실한 사실: 이 생태계는 version updates만 지원하고 security updates는 지원하지 않습니다.
  # 불확실: allow/ignore의 dependency-name이 이 생태계에서 동작하는지는 공식 문서에
  #    명시가 없습니다. 특정 훅만 추적 대상에서 빼야 한다면 문서 확인 후 시도하세요.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(lint)"
    groups:
      pre-commit-minor-patch:
        update-types: ["minor", "patch"]

  # ── 프론트엔드: 등록을 막던 조건(package.json 부재)은 #32로 해소됐습니다. 활성화 여부는
  #    스프린트 중 PR 소음과의 트레이드오프라 프론트엔드 오너(최혜리) 판단으로 남깁니다
  #    (후속_과제.md 12번). 켤 때는 아래 블록의 주석만 해제하면 됩니다.
  # - package-ecosystem: "npm"
  #   directory: "/apps/frontend"
  #   schedule:
  #     interval: "weekly"
  #     day: "monday"
  #   open-pull-requests-limit: 3
  #   commit-message:
  #     prefix: "chore(deps)"
  #   groups:
  #     frontend-minor-patch:
  #       update-types: ["minor", "patch"]
