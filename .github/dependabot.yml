# .github/dependabot.yml — 의존성 취약점/노후화 자동 감지.
#
# 존재 이유: 이 레포는 public이고, 개인정보(위치·장애 여부)를 다루는 서비스라 취약 의존성이
# 그대로 심사 리스크가 됩니다(QA/보안 소관 리스크 ⑨). Dependabot은 GitHub Actions 분을
# 소모하지 않으므로 무료 플랜에서도 부담이 없습니다.
#
# ⚠️ PR 노이즈 관리: 해커톤 일정(8/10 제출) 중 매일 PR이 쌓이면 팀이 무시하게 됩니다.
#    weekly + minor/patch 그룹화 + PR 상한으로 "주 1회 한두 개"가 되도록 조정했습니다.
version: 2
updates:
  # ── GitHub Actions 버전 (actions/checkout@v4 등)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  # ── 파이썬 앱 (앱마다 pyproject.toml이 따로 있으므로 디렉토리도 따로 등록해야 합니다)
  # 추정: Dependabot의 pip 생태계는 PEP 621 pyproject.toml을 인식합니다. 첫 주에 PR이
  # 하나도 열리지 않으면 Insights > Dependency graph > Dependabot 탭에서 파싱 오류를 확인하세요.
  - package-ecosystem: "pip"
    directory: "/apps/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directory: "/apps/ai-engine"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      ai-engine-minor-patch:
        update-types: ["minor", "patch"]

  # ── 프론트엔드: package.json이 없는 디렉토리를 등록하면 Dependabot이 매주 파싱 오류를
  #    기록합니다. 스캐폴딩(P1, 이진호) 후 아래 블록의 주석을 해제하세요.
  - package-ecosystem: "npm"
    directory: "/apps/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
