# .github/workflows/frontend-ci.yml
name: Frontend CI
# ⚠️ paths 필터가 걸린 워크플로이므로 required status check로 지정하지 마세요.
#    (apps/frontend 변경이 없는 PR에서는 체크가 생성되지 않아 머지가 영구 블록됩니다 —
#     docs/공통_가이드/저장소_운영.md §4의 알려진 함정. 파이썬 앱 CI만 required입니다.)
#
# apps/frontend는 #32에서 실제 PWA로 들어왔습니다. package.json·package-lock.json과
# lint/typecheck/build 스크립트가 모두 커밋돼 있으므로, 스캐폴딩 전을 가정한 조건부 건너뛰기는
# 제거했습니다 — 스크립트가 사라지면 조용히 통과하는 대신 실패해야 합니다.
# 패키지 매니저를 npm에서 바꾸는 경우(pnpm/yarn) install 단계와 cache 설정을 함께 교체하세요.
on:
  pull_request:
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      # lockfile 기준 재현 설치 — npm install이 아니라 npm ci 를 씁니다.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
