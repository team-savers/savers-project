# apps/ai-engine — RAG 검색 + 가드레일 기반 메시지 생성 (독립 배포 단위)
# 설치: 레포 루트에서  pip install -e "./apps/ai-engine[dev]"
#
# ⚠️ 이 앱은 backend와 "독립적으로 배포 가능"해야 합니다 (AGENTS.md의 레포 구조 규약).
#    backend를 import하지 마세요 — 통신은 packages/contracts의 HTTP 계약으로만 합니다.
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "savers-ai-engine"
version = "0.1.0"
description = "SAVERS AI 엔진 — 국민행동요령 RAG 검색과 가드레일 제약 메시지 생성"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]
# ── RAG 스택은 무거우므로 core가 아닌 extra로 분리합니다 (CI를 가볍게 유지).
#    실제 개발 시: pip install -e "./apps/ai-engine[rag]"
# rag = [
#     "langchain>=0.2.0",
#     "chromadb>=0.5.0",
# ]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = ["src"]
ignore_missing_imports = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# RAG extra는 타입 스텁이 없으므로 도입 시 아래 예외를 켜세요.
# [[tool.mypy.overrides]]
# module = ["langchain.*", "chromadb.*"]
# ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
