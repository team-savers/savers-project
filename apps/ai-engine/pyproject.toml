# apps/ai-engine — RAG 검색 + 가드레일 기반 메시지 생성 (독립 배포 단위)
# 설치: 레포 루트에서  pip install -e "./apps/ai-engine[dev]"
#
# ⚠️ 이 앱은 backend와 "독립적으로 배포 가능"해야 합니다 (AGENTS.md의 레포 구조 규약).
#    backend를 import하지 마세요 — 통신은 packages/contracts의 HTTP 계약으로만 합니다.
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "savers-ai-engine"
version = "0.1.0"
description = "SAVERS AI 엔진 — 국민행동요령 RAG 검색과 가드레일 제약 메시지 생성"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    # ⚠️ 버전 고정 이유와 함께 올려야 할 파일 목록은 apps/backend/pyproject.toml 참고.
    #    세 곳(여기·backend·.pre-commit-config.yaml)이 항상 같은 버전이어야 합니다.
    "ruff==0.15.22",
    "mypy>=1.10.0",
]
# ── RAG 스택은 무거우므로 core가 아닌 extra로 분리합니다 (CI를 가볍게 유지).
#    실제 개발 시: pip install -e "./apps/ai-engine[rag]"
# sentence-transformers: 로컬 BGE-M3 임베딩 (한국어 검색 벤치마크 기준 확정).
#    ⚠️ 백로그: 실제 코퍼스 확보 후 KURE(한국어 특화 모델)와 근거 일치율 비교 예정.
#    ⚠️ 백로그: CPU 추론 지연이 알림 도달 속도 KPI(≤30s, ADR-0003 GPU 없음)에 주는
#       영향은 아직 미측정 — 임베딩을 실제로 붙이는 시점에 반드시 실측할 것.
rag = [
    "langchain>=0.2.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# ⚠️ 코퍼스 픽스처는 .py가 아니므로 명시하지 않으면 wheel/컨테이너 이미지에서 빠집니다.
#    editable 설치에서는 소스를 직접 가리키므로 증상이 없다가 Dockerfile 빌드에서만
#    FileNotFoundError로 터집니다 — 실제 코퍼스(Chroma)로 교체되기 전까지 유지하세요.
[tool.setuptools.package-data]
ai_engine = ["fixtures/*.jsonl", "fixtures/*.csv"]

[tool.pyright]
extraPaths = ["src"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
mypy_path = ["src"]
ignore_missing_imports = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["langchain.*", "chromadb.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# eval/도 수집 대상입니다 — 지표 함수(근거 일치율·명확성 등)는 제출물의 근거가 되는 코드라
# CI에서 회귀 검사돼야 합니다. 다만 채점 하네스 "실행"은 외부 API 호출이라 CI 범위 밖입니다:
# ⚠️ eval/ 안에서 test_*.py 이름은 순수 지표 함수 단위 테스트에만 쓰세요.
#    실제 채점 실행 스크립트는 run_*.py 처럼 test_ 로 시작하지 않게 이름 지어야
#    CI가 외부 API를 호출하지 않습니다(비용·비결정성).
testpaths = ["tests", "eval"]
