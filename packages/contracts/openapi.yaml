            type: string
            example: g_4e8b1c7d2a9f5036e8b1c7d2a9f5036e8b1c7d2a
      responses:
        '200':
          description: 보호자 상태
          headers:
            Cache-Control:
              description: 민감 정보이므로 저장을 금지한다.
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuardianStatus'
        '404':
          description: 토큰 부재
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: 토큰 만료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

